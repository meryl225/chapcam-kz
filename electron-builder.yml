# Configuration electron-builder pour ChapCam Desktop
# Empaquete l'app + la camera virtuelle native "ChapCam Camera".
# Les binaires natifs sont produits par .github/workflows/desktop-build.yml
# (native/windows et native/macos) dans resources/vcam/.
appId: com.chapcam.desktop
productName: ChapCam
copyright: Copyright (c) ChapCam

directories:
  output: dist
  buildResources: electron/build

files:
  - electron/**/*
  - public/**/*
  - package.json

afterPack: electron/build/after-pack.js

win:
  target:
    - target: nsis
      arch: [x64]
  # L'app n'a plus besoin d'etre admin : seule l'installation l'est (perMachine).
  requestedExecutionLevel: asInvoker
  artifactName: ChapCam-Setup-${version}.${ext}
  extraResources:
    - from: resources/vcam/win
      to: vcam/win

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ChapCam
  include: electron/build/installer.nsh

mac:
  target:
    - dmg
  category: public.app-category.video
  artifactName: ChapCam-${version}-${arch}.${ext}
  minimumSystemVersion: "12.3"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: electron/build/entitlements.mac.plist
  entitlementsInherit: electron/build/entitlements.mac.inherit.plist
  # L'extension camera est deja signee avec ses propres entitlements.
  signIgnore:
    - "Contents/Library/SystemExtensions"
  extraResources:
    - from: resources/vcam/mac
      to: vcam/mac
  extendInfo:
    NSCameraUsageDescription: ChapCam utilise la camera pour la transformation du visage en temps reel.
    NSMicrophoneUsageDescription: ChapCam utilise le micro pour la transformation de la voix.
    NSSystemExtensionUsageDescription: Ajoute la camera "ChapCam Camera" utilisable dans Zoom, Teams, Meet, Discord et OBS.

linux:
  target:
    - AppImage
  category: Video
