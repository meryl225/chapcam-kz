name = "chapcam-live-relay"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Requires the chapcam.com zone to be on Cloudflare. Uncomment once DNS is moved.
# routes = [{ pattern = "relay.chapcam.com", custom_domain = true }]

[[durable_objects.bindings]]
name = "LIVE_RELAY"
class_name = "LiveRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveRelay"]

[observability]
enabled = true

# Secrets (not stored here), derived server-side in lib/live-engine/tokens.ts:
#   RELAY_TICKET_KEY     (v2, Chapcam protocol)
#   RELAY_TICKET_KEY_V1  (v1, legacy passthrough for installed mobile builds)
